<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Financial Health Check</title>
  <style>
    :root { --ink: #1d2330; --muted: #5b6475; --line: #d8dde6; --bg: #f6f7f9; --card: #ffffff;
            --red: #b42318; --red-bg: #fde8e7; --yellow: #8a6100; --yellow-bg: #fff4d6; --ok: #1f6f43; }
    body { font-family: system-ui, "Segoe UI", sans-serif; margin: 0; background: var(--bg); color: var(--ink); }
    header { padding: 16px 24px; background: var(--card); border-bottom: 1px solid var(--line); }
    header h1 { margin: 0; font-size: 20px; }
    header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
    main { max-width: 1100px; margin: 0 auto; padding: 16px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .card h2 { margin: 0 0 12px; font-size: 16px; }
    label { display: inline-block; margin: 0 16px 8px 0; }
    label.inline { margin-right: 12px; }
    input, select, textarea, button { font: inherit; }
    textarea { width: 100%; box-sizing: border-box; margin: 8px 0; font-family: Consolas, monospace; font-size: 12px; }
    button { padding: 4px 12px; cursor: pointer; }
    table { border-collapse: collapse; }
    th, td { border-bottom: 1px solid var(--line); padding: 4px 8px; text-align: left; vertical-align: top; }
    .grid input.num { width: 120px; text-align: right; }
    .code { color: var(--muted); font-size: 12px; white-space: nowrap; }
    tr.group td { background: var(--bg); font-weight: 600; }
    .scroll { overflow-x: auto; }
    .hint { color: var(--muted); font-size: 13px; }
    .error, li.error { color: var(--red); }
    li.warning { color: var(--yellow); }
    .file-bar { position: sticky; top: 0; z-index: 1; }
    .disclaimer { font-weight: 600; }
    .result-title { font-size: 18px; font-weight: 600; margin: 0; }
    ul.counts li.red, li.flag.red { color: var(--red); }
    ul.counts li.yellow, li.flag.yellow { color: var(--yellow); }
    li.flag.missing, li.flag.none, li.flag.not-applicable { color: var(--muted); }
    li.flag { margin-bottom: 4px; }
    td.num, th.num { text-align: right; }
    button.cell { border: none; background: none; padding: 0; font: inherit; color: var(--ink); cursor: pointer; text-decoration: underline dotted; }
    button.cell.noted::after { content: " *"; color: var(--muted); }
    .detail { background: var(--bg); padding: 8px; border-radius: 6px; }
    header a { font-size: 13px; }
    .demo-banner { background: #e8f0fe; color: #1a4fa0; padding: 8px 12px; border-radius: 6px; margin-bottom: 16px; }
    @page { size: A4 portrait; margin: 12mm; }
    @media print {
      body { background: #fff; font-size: 10px; }
      header { padding: 0 0 6px; border: none; }
      header a, .demo-banner, .no-print, main > .card:not(.results) { display: none !important; }
      main { max-width: none; padding: 0; }
      .card { border: none; padding: 0; margin: 0; }
      .scroll { overflow: visible; }
      table.grid { width: 100%; table-layout: fixed; }
      table.grid th, table.grid td { padding: 2px 4px; font-size: 9px; word-wrap: break-word; }
      table.ratios td.code, table.ratios th:nth-child(2) { width: 30%; }
      button.cell { text-decoration: none; color: #000; }
      button.cell.noted::after { content: ""; }
      .detail { display: none; }
      h2 { font-size: 13px; } h3 { font-size: 11px; margin: 8px 0 4px; }
      li.flag { font-size: 9px; margin-bottom: 1px; }
      tr, li { break-inside: avoid; }
      .disclaimer { border: 1px solid #000; padding: 4px; }
    }
    .warning-banner { background: var(--yellow-bg); color: var(--yellow); padding: 6px 10px; border-radius: 6px; margin: 8px 0 0; }
  </style>
</head>
<body>
  <header>
    <h1>Financial Health Check (bản nội bộ)</h1>
    <p>Tín hiệu để hỏi tiếp, không phải kết luận và không phải gợi ý mua bán cổ phiếu.
      <span class="no-print"><a href="index.html?demo" id="demo-link">Xem ví dụ HPG</a> · <a href="index.html">Dữ liệu của tôi</a> ·
      In kết quả: Ctrl + P (chỉ in phần Kết quả, khổ A4 dọc)</span></p>
  </header>
  <main id="app"></main>

  <script src="src/fhc.js"></script>
  <script src="src/lines.js"></script>
  <script src="src/format.js"></script>
  <script src="src/checks.js"></script>
  <script src="src/ratios.js"></script>
  <script src="src/altman.js"></script>
  <script src="src/beneish.js"></script>
  <script src="src/piotroski.js"></script>
  <script src="src/flags.js"></script>
  <script src="src/entry.js"></script>
  <script src="src/ui.js"></script>
  <script src="src/storage.js"></script>
  <script src="src/results.js"></script>
  <script src="src/sample.js"></script>
  <script>
    (function () {
      var demo = /[?&]demo\b/.test(window.location.search);
      var storage = null;
      // Demo mode never touches the Owner's draft.
      if (!demo) { try { storage = window.localStorage; } catch (e) { storage = null; } }
      var main = document.getElementById('app');
      var app = FHC.ui.mount(main, { storage: storage });
      if (demo) {
        app.openText(FHC.storage.serialize(FHC.sample.hpg()));
        var note = document.createElement('p');
        note.className = 'demo-banner';
        note.textContent = 'Đang xem VÍ DỤ HPG (số CafeF, chưa đối chiếu báo cáo kiểm toán). Thay đổi ở đây không được giữ lại. Bấm "Dữ liệu của tôi" ở trên để quay về.';
        main.parentNode.insertBefore(note, main);
      }
    })();
  </script>
</body>
</html>
